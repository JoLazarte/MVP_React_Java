# =========================================================
# PanStock API - application-local.example.properties
#
# La contraseña de la base de datos y la clave JWT NO se escriben acá.
# Se definen de una de estas dos formas:
#   a) en application.properties (ignorado por git; copiá
#      application-local.example.properties y completalo), o
#   b) como variables de entorno: DB_PASSWORD, JWT_SECRET
#      (y opcionalmente DB_USERNAME).
# =========================================================

spring.application.name=panstock-api
server.port=8081

# Perfil activo por defecto (local). En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# =========================================================
# BASE DE DATOS - MariaDB / MySQL (local)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/panstock_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:panstock_user}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# SEGURIDAD
# =========================================================
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=86400000

# Orígenes que pueden llamar a la API desde un navegador (CORS), separados por coma
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# =========================================================
# ZONA HORARIA
# =========================================================
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# =========================================================
# ACTUATOR: solo se expone /actuator/health
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

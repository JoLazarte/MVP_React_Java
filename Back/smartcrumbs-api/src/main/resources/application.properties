# =========================================================
# SmartCrumbs API - application.properties
# Configuración común y de desarrollo local. NO contiene secretos.
#
# SECRETOS (contraseña de la base de datos y clave JWT). Dos opciones:
#
#   a) Crear en esta misma carpeta el archivo application-local.properties
#      (está en .gitignore: nunca se sube a git) con estas tres líneas:
#
#          spring.datasource.username=smartcrumbs_user
#          spring.datasource.password=TU_CONTRASEÑA_DE_MYSQL
#          application.security.jwt.secretKey=UNA_CLAVE_ALEATORIA_DE_32_O_MAS_CARACTERES
#
#      Para generar la clave:  openssl rand -hex 48
#      El usuario y la contraseña son los de smartcrumbs_user, que se crea
#      con database/smartcrumbs_schema_mock.sql.
#
#   b) O definir las variables de entorno DB_PASSWORD y JWT_SECRET
#      (y opcionalmente DB_USERNAME).
#
# Producción: ver application-prod.properties (SPRING_PROFILES_ACTIVE=prod).
# =========================================================

spring.application.name=smartcrumbs-api
server.port=8081

# Perfil activo por defecto (local). En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# =========================================================
# BASE DE DATOS - MariaDB / MySQL (local)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smartcrumbs_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:smartcrumbs_user}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# SEGURIDAD
# =========================================================
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=86400000

# Orígenes que pueden llamar a la API desde un navegador (CORS), separados por coma
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# =========================================================
# ZONA HORARIA
# =========================================================
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# =========================================================
# ALERTAS: generación programada (milisegundos)
# =========================================================
app.alerts.initial-delay-ms=60000
app.alerts.generation-interval-ms=900000

# =========================================================
# ACTUATOR: solo se expone /actuator/health
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
